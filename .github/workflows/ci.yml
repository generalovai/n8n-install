name: Проверка установщика

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Намеренно не дублируем шаги: запускаем ровно тот же набор проверок,
      # что и локально одной командой. Одна логика - один источник правды.
      - name: tests/run.sh
        run: tests/run.sh
